# Render Blueprint for the session API.
# Free web service, no disk database. Set WORKER_URL and WORKER_SECRET
# when applying the Blueprint. Render supplies PORT and RENDER_EXTERNAL_URL.
services:
  - type: web
    name: home-value-api
    runtime: node
    plan: free
    rootDir: api
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: WORKER_URL
        sync: false
      - key: WORKER_SECRET
        sync: false
      - key: NODE_VERSION
        value: "22"
